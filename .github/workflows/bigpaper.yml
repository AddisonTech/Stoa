name: bigpaper

# The big paper account: trial 12 as registered (big_paper.strategy) on its own ~$100,000
# Alpaca paper account (stoa/bigpaper.py). Kept apart from the $100 account: only the big account's keys are
# passed here, its state lives in big-paper/ on the stoa-state branch, its alerts start
# with BIG PAPER, and it shares no concurrency group with the daily workflow.
# It does nothing until both ALPACA_BIG_PAPER_KEY_ID and ALPACA_BIG_PAPER_SECRET are set
# AND big_paper.enabled is true in config/default.yaml.
# The day: FEED at 8:15 am, PICKS at 9:00 am (auto-approved), EXECUTE at 9:45 am, SUMMARY
# at 5:15 pm. The news brain's rolling state (stoa/newsbrain/feed.py) lives in the private
# Hugging Face dataset big_paper.feed_repo, never on stoa-state or in this repository: FEED
# downloads it, updates it and uploads it; PICKS downloads it. HF_TOKEN reaches only the
# step that runs Stoa, which passes it to each call and never saves it.
# FEED and PICKS (and replays) run on Windows, like the Dell that built trial 12's panel:
# Windows and Linux round log and log1p differently in the last digit, and the model's cut
# points sit exactly on the Dell's values, so only Windows gives the Dell's numbers (checked
# on three mornings, every value equal). numpy 2.5.4 goes no further than X86_V3 there, as on
# the Dell; NPY_DISABLE_CPU_FEATURES keeps any AVX-512 path off, since the Dell has none.
# model-check runs on Windows too: it scores the Dell's backfilled rows with a model version
# and requires the Dell's p to the last bit (docs/RUNBOOK.md 13b, the shadow scoreboard).
# EXECUTE, SUMMARY and scoreboard stay on Linux. feed-reset puts the dataset's live state back to the
# replay_from commit (docs/RUNBOOK.md 13b).
# The GitHub crons below are the backup, a few minutes late, in both the EDT and EST slot.
run-name: >-
  ${{ github.event_name == 'schedule' && format('schedule {0}', github.event.schedule)
  || format('{0} via {1}', inputs.job, inputs.source || 'manual') }}
on:
  schedule:
    - cron: "22 12 * * 1-5" # FEED backup, EDT slot (8:22 am EDT)
    - cron: "22 13 * * 1-5" # FEED backup, EST slot (8:22 am EST)
    - cron: "22 21 * * 1-5" # SUMMARY backup, EDT slot (5:22 pm EDT)
    - cron: "22 22 * * 1-5" # SUMMARY backup, EST slot (5:22 pm EST)
    - cron: "7 13 * * 1-5" # PICKS backup, EDT slot (9:07 am EDT)
    - cron: "7 14 * * 1-5" # PICKS backup, EST slot (9:07 am EST)
    - cron: "52 13 * * 1-5" # EXECUTE backup, EDT slot (9:52 am EDT)
    - cron: "52 14 * * 1-5" # EXECUTE backup, EST slot (9:52 am EST)
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [feed, picks, execute, summary, status, kill-switch-reset, feed-reset, scoreboard, model-check]
        default: status
      force:
        description: "Run even outside the window or again for the same session"
        type: boolean
        default: false
      source:
        description: "What started this run: cron-job.org, dell, or blank for by hand"
        type: string
        default: ""
      dry:
        description: "Dry run of feed or picks: no orders, nothing saved, alerts only logged"
        type: boolean
        default: false
      replay:
        description: "Dry replay of past mornings, e.g. picks@2026-10-26T09:00 feed@2026-10-27T08:15"
        type: string
        default: ""
      model:
        description: "Dry picks on this model version, or the version model-check checks"
        type: string
        default: ""
      replay_from:
        description: "Replays and feed-reset start from this commit of the feed's dataset (id or message)"
        type: string
        default: "seed 2026-10-26"

concurrency:
  group: stoa-big-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: >-
      ${{ (contains(fromJSON('["feed","picks","model-check"]'), inputs.job) || inputs.replay != ''
      || contains(fromJSON('["22 12 * * 1-5","22 13 * * 1-5","7 13 * * 1-5","7 14 * * 1-5"]'),
      github.event.schedule)) && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.replay != '' && 120 || 45 }}
    defaults:
      run:
        shell: bash
    env:
      ALPACA_BIG_PAPER_KEY_ID: ${{ secrets.ALPACA_BIG_PAPER_KEY_ID }}
      ALPACA_BIG_PAPER_SECRET: ${{ secrets.ALPACA_BIG_PAPER_SECRET }}
      STOA_NTFY_TOPIC: ${{ secrets.STOA_NTFY_TOPIC }}
      STOA_NTFY_TOKEN: ${{ secrets.STOA_NTFY_TOKEN }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NTFY_SERVER: ${{ vars.STOA_NTFY_SERVER || 'https://ntfy.sh' }}
      STOA__ALERTS__SERVER: ${{ vars.STOA_NTFY_SERVER || 'https://ntfy.sh' }}
      STOA__BIG_PAPER__STATE_DIR: state-branch/big-paper
      STOA__STATE__SHARED_DIR: state-branch/shared
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUTF8: "1"
      JOB_INPUT: ${{ inputs.job }}
      FORCE_INPUT: ${{ inputs.force }}
      DRY_INPUT: ${{ inputs.dry }}
      REPLAY_INPUT: ${{ inputs.replay }}
      REPLAY_FROM: ${{ inputs.replay_from }}
      MODEL_INPUT: ${{ inputs.model }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Pick the job
        id: pick
        run: |
          if [ -n "$REPLAY_INPUT" ]; then
            job="replay"
          elif [ -n "$JOB_INPUT" ]; then
            job="$JOB_INPUT"
          elif [ "$SCHEDULE" = "22 12 * * 1-5" ] || [ "$SCHEDULE" = "22 13 * * 1-5" ]; then
            job="feed"
          elif [ "$SCHEDULE" = "22 21 * * 1-5" ] || [ "$SCHEDULE" = "22 22 * * 1-5" ]; then
            job="summary"
          elif [ "$SCHEDULE" = "7 13 * * 1-5" ] || [ "$SCHEDULE" = "7 14 * * 1-5" ]; then
            job="picks"
          else
            job="execute"
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "Running $job"

      - name: Check the big account's keys
        id: secrets
        run: |
          if [ -z "$ALPACA_BIG_PAPER_KEY_ID" ] || [ -z "$ALPACA_BIG_PAPER_SECRET" ]; then
            echo "The big paper account is off: ALPACA_BIG_PAPER_KEY_ID and ALPACA_BIG_PAPER_SECRET"
            echo "are not both set as repository secrets. See docs/RUNBOOK.md. Nothing done."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep line endings as committed
        if: steps.secrets.outputs.ready == 'true' && runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out code
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Check out state branch
        if: steps.secrets.outputs.ready == 'true'
        run: bash scripts/state-branch.sh checkout state-branch

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        env:
          JOB: ${{ steps.pick.outputs.job }}
          NPY_DISABLE_CPU_FEATURES: "${{ runner.os == 'Windows' && 'X86_V4 AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR' || '' }}"
        # The feed and the picks run the news brain: the exact versions the rolling state was
        # built and checked with (the state refuses another pandas), CPU-only torch.
        run: |
          if [ "$JOB" = "feed" ] || [ "$JOB" = "picks" ] || [ "$JOB" = "replay" ] || [ "$JOB" = "feed-reset" ] || [ "$JOB" = "model-check" ]; then
            pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
            pip install ".[yahoo,reader]" pandas==3.1.0 numpy==2.5.4 scikit-learn==1.9.1 \
              transformers==5.20.2 huggingface_hub==2.3.0
          else
            # summary and scoreboard grade the shadow scoreboard in the feed's dataset
            pip install ".[yahoo]" huggingface_hub==2.3.0
          fi
          python -c "import numpy as np, platform; from numpy._core._multiarray_umath import __cpu_features__ as f; print(platform.platform(), np.__version__, [k for k, v in f.items() if v and ('512' in k or k == 'X86_V4')] or 'no AVX-512')"
          python -c "import numpy as np; np.show_runtime()"

      - name: Cache FinBERT
        if: steps.secrets.outputs.ready == 'true' && contains(fromJSON('["feed","picks","replay"]'), steps.pick.outputs.job)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: finbert-${{ runner.os }}-0bc2ac10dda6929bcb1f77ccc43c7ec5c424f031

      - name: Run
        if: steps.secrets.outputs.ready == 'true'
        env:
          JOB: ${{ steps.pick.outputs.job }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STOA__BIG_PAPER__FEED_DIR: ${{ runner.temp }}/stoa-feed
          NPY_DISABLE_CPU_FEATURES: "${{ runner.os == 'Windows' && 'X86_V4 AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR' || '' }}"
        # A replay runs each step from an empty feed folder, as a fresh runner would, with its
        # own copy of the dataset started from REPLAY_FROM: the live state never moves.
        run: |
          if [ "$JOB" = "model-check" ]; then
            stoa bigpaper model-check --model "$MODEL_INPUT"
            exit 0
          fi
          if [ "$JOB" = "feed-reset" ]; then
            python -m stoa.newsbrain feedreset "$REPLAY_FROM"
            exit 0
          fi
          if [ "$JOB" = "replay" ]; then
            clear() { python -c "import shutil, sys; shutil.rmtree(sys.argv[1], ignore_errors=True)" "$1"; }
            clear "${STOA__BIG_PAPER__FEED_DIR}-replay"
            for step in $REPLAY_INPUT; do
              clear "$STOA__BIG_PAPER__FEED_DIR"
              start=$SECONDS
              stoa bigpaper "${step%%@*}" --dry --at "${step#*@}" --replay-from "$REPLAY_FROM"
              echo "TIMING ${step}: $((SECONDS - start)) s"
            done
            exit 0
          fi
          flags=()
          if [ "$FORCE_INPUT" = "true" ]; then flags+=(--force); fi
          if [ "$DRY_INPUT" = "true" ]; then flags+=(--dry); fi
          if [ -n "$MODEL_INPUT" ]; then flags+=(--model "$MODEL_INPUT"); fi
          start=$SECONDS
          stoa bigpaper "$JOB" "${flags[@]}"
          echo "TIMING ${JOB}: $((SECONDS - start)) s"

      - name: Save state
        if: always() && steps.secrets.outputs.ready == 'true' && inputs.dry != true && inputs.replay == ''
        run: bash scripts/state-branch.sh commit state-branch "big paper ${{ steps.pick.outputs.job }} run ${{ github.run_id }}"
