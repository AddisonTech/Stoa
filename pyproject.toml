[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stoa"
version = "0.2.0"
description = "Daily-cadence AI equity trading system with a rule-based risk engine and honest grading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Addison Smith" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=2.3",
    "exchange_calendars>=4.5",
    "click>=8.1",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "scipy-stubs"]

[project.scripts]
stoa = "stoa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stoa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "SIM108", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "N802", "N806"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "stoa.risk",
    "stoa.portfolio",
    "stoa.money",
    "stoa.state",
    "stoa.clock",
    "stoa.alerts",
    "stoa.journal",
    "stoa.holdout",
    "stoa.broker.*",
    "stoa.adjust",
    "stoa.analyst",
    "stoa.approvals",
    "stoa.calibration",
    "stoa.crosscheck",
    "stoa.events",
    "stoa.exam",
    "stoa.experiments",
    "stoa.healthcheck",
    "stoa.membership",
    "stoa.model",
    "stoa.pit",
    "stoa.redact",
    "stoa.retrain",
    "stoa.sizing",
    "stoa.tracking",
    "stoa.walkforward",
]
strict = true

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "yfinance.*", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:exchange_calendars.*",
    "ignore:Series.values returning an ndarray:FutureWarning",
    "ignore:Series.values returning an ndarray",
]
